<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>運転日報</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f4f0; --surface: #fff; --surface2: #f0efe9;
    --border: #d6d3c8;
    --blue: #1a3a5c; --blue2: #2d6a9f;
    --green: #1a5c3a; --green2: #2d9f6a;
    --text: #1c1c1c; --text-muted: #7a7669;
    --danger: #b5382a; --radius: 10px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--text); font-family:'Noto Sans JP',sans-serif; font-size:14px; }

  /* ===== SCREEN SYSTEM ===== */
  .screen { display:none; min-height:100vh; flex-direction:column; }
  .screen.active { display:flex; }

  /* ===== HOME ===== */
  #home {
    background: linear-gradient(160deg, #1a3a5c 0%, #1a5c3a 100%);
    align-items:center; justify-content:center; padding:32px 24px;
  }
  .home-inner { width:100%; max-width:400px; }
  .home-logo { text-align:center; margin-bottom:48px; }
  .home-logo .icon { font-size:56px; display:block; margin-bottom:12px; }
  .home-logo h1 { font-size:28px; font-weight:900; color:#fff; letter-spacing:.1em; }
  .home-logo p { font-size:12px; color:rgba(255,255,255,.6); font-family:'Space Mono',monospace; margin-top:4px; }
  .home-date { text-align:center; color:rgba(255,255,255,.7); font-size:13px; margin-bottom:40px; font-family:'Space Mono',monospace; }

  .home-btn {
    width:100%; border:none; border-radius:14px; padding:22px 20px;
    cursor:pointer; margin-bottom:14px;
    display:flex; align-items:center; gap:16px;
    transition:all .2s; text-align:left;
  }
  .home-btn:active { transform:scale(.97); }
  .home-btn.start { background:#fff; }
  .home-btn.end   { background:rgba(255,255,255,.15); border:2px solid rgba(255,255,255,.4); }
  .home-btn .btn-icon { font-size:36px; flex-shrink:0; }
  .home-btn .btn-text h2 { font-size:18px; font-weight:900; }
  .home-btn .btn-text p  { font-size:12px; margin-top:3px; opacity:.7; }
  .home-btn.start .btn-text h2 { color:var(--blue); }
  .home-btn.start .btn-text p  { color:var(--blue); }
  .home-btn.end   .btn-text h2 { color:#fff; }
  .home-btn.end   .btn-text p  { color:#fff; }
  .home-btn .arrow { margin-left:auto; font-size:20px; opacity:.4; flex-shrink:0; }
  .home-btn.start .arrow { color:var(--blue); }
  .home-btn.end   .arrow { color:#fff; }

  /* ===== FORM SCREENS ===== */
  .form-screen { background:var(--bg); }
  .form-header {
    color:#fff; padding:20px 20px 16px;
    display:flex; align-items:center; gap:14px; flex-shrink:0;
  }
  .form-header.start { background:var(--blue); }
  .form-header.end   { background:var(--green); }
  .back-btn {
    background:rgba(255,255,255,.2); border:none; border-radius:8px;
    color:#fff; width:36px; height:36px; font-size:18px;
    cursor:pointer; display:grid; place-items:center; flex-shrink:0;
    transition:background .2s;
  }
  .back-btn:hover { background:rgba(255,255,255,.35); }
  .form-header-text h2 { font-size:18px; font-weight:900; }
  .form-header-text p  { font-size:11px; opacity:.65; font-family:'Space Mono',monospace; margin-top:2px; }

  .form-body { flex:1; overflow-y:auto; padding:16px; }
  .form-inner { max-width:680px; margin:0 auto; }

  /* Section */
  .section { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 18px; margin-bottom:12px; }
  .section-title {
    font-size:10px; font-weight:700; letter-spacing:.15em; text-transform:uppercase;
    font-family:'Space Mono',monospace; display:flex; align-items:center; gap:6px;
    padding-bottom:10px; margin-bottom:14px; border-bottom:2px solid;
  }
  .section-title.blue  { color:var(--blue);  border-color:var(--blue); }
  .section-title.green { color:var(--green); border-color:var(--green); }
  .section-title.gray  { color:var(--text-muted); border-color:var(--border); }

  /* Grid / Field */
  .grid  { display:grid; gap:12px; }
  .g2    { grid-template-columns:1fr 1fr; }
  @media(max-width:460px) { .g2 { grid-template-columns:1fr; } }
  .field { display:flex; flex-direction:column; gap:4px; }
  .field label { font-size:10px; font-weight:700; color:var(--text-muted); letter-spacing:.06em; text-transform:uppercase; }
  .req { color:var(--danger); margin-left:2px; }

  input[type=text], input[type=date], input[type=time], input[type=number], textarea {
    background:var(--surface2); border:1px solid var(--border);
    border-radius:7px; color:var(--text);
    font-family:'Noto Sans JP',sans-serif; font-size:15px;
    padding:11px 13px; width:100%; outline:none;
    transition:border-color .15s, box-shadow .15s;
    -webkit-appearance:none; appearance:none;
  }
  input:focus, textarea:focus { border-color:var(--blue2); box-shadow:0 0 0 3px rgba(45,106,159,.12); background:#fff; }
  textarea { resize:vertical; min-height:80px; }

  .calc-field input { background:#e8f4e8; border-color:var(--green); font-weight:700; color:var(--green); }
  .calc-note { font-size:10px; color:var(--green); font-family:'Space Mono',monospace; margin-top:3px; }

  /* Photo */
  .photo-upload { border:2px dashed var(--border); border-radius:8px; padding:16px; text-align:center; cursor:pointer; background:var(--surface2); position:relative; transition:all .2s; margin-bottom:8px; }
  .photo-upload:hover { border-color:var(--blue2); background:#eef4fa; }
  .photo-upload input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
  .photo-upload-icon { font-size:22px; margin-bottom:4px; }
  .photo-upload p { font-size:12px; color:var(--text-muted); }
  .photo-upload strong { color:var(--blue2); }
  .preview-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .preview-row img { width:72px; height:72px; object-fit:cover; border-radius:7px; border:2px solid var(--border); }

  /* Submit btn */
  .btn-submit {
    width:100%; border:none; border-radius:10px; padding:16px;
    font-size:16px; font-weight:900; font-family:'Noto Sans JP',sans-serif;
    cursor:pointer; letter-spacing:.08em; transition:all .2s;
    display:flex; align-items:center; justify-content:center; gap:8px;
    color:#fff;
  }
  .btn-submit.blue  { background:var(--blue); }
  .btn-submit.blue:hover  { background:var(--blue2); transform:translateY(-1px); }
  .btn-submit.green { background:var(--green); }
  .btn-submit.green:hover { background:var(--green2); transform:translateY(-1px); }
  .btn-submit:disabled { opacity:.6; cursor:not-allowed; transform:none !important; }

  /* Success overlay */
  .overlay { display:none; position:fixed; inset:0; place-items:center; z-index:200; }
  .overlay.show { display:grid; }
  .overlay.blue-bg  { background:rgba(26,58,92,.9); }
  .overlay.green-bg { background:rgba(26,92,58,.9); }
  .success-box { background:var(--surface); border-radius:16px; padding:36px 28px; text-align:center; max-width:320px; margin:0 20px; }
  .success-box.blue-top  { border-top:4px solid var(--blue); }
  .success-box.green-top { border-top:4px solid var(--green); }
  .success-box .big { font-size:52px; margin-bottom:10px; }
  .success-box h2 { font-size:18px; font-weight:900; margin-bottom:8px; }
  .success-box.blue-top  h2 { color:var(--blue); }
  .success-box.green-top h2 { color:var(--green); }
  .success-box p { font-size:12px; color:var(--text-muted); line-height:1.7; }
  .report-id { font-family:'Space Mono',monospace; font-size:11px; color:var(--blue); margin-top:10px; background:var(--surface2); padding:8px; border-radius:6px; }
  .overlay-btns { display:flex; gap:8px; margin-top:16px; }
  .close-btn { flex:1; background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:10px; cursor:pointer; font-family:'Noto Sans JP',sans-serif; font-size:13px; font-weight:700; transition:all .2s; }
  .close-btn:hover { border-color:var(--blue); color:var(--blue); }
  .home-btn-small { flex:1; background:var(--blue); border:none; color:#fff; border-radius:8px; padding:10px; cursor:pointer; font-family:'Noto Sans JP',sans-serif; font-size:13px; font-weight:700; transition:all .2s; }
  .home-btn-small:hover { background:var(--blue2); }
</style>
</head>
<body>

<!-- ===== HOME ===== -->
<div class="screen active" id="home">
  <div class="home-inner">
    <div class="home-logo">
      <span class="icon">🚚</span>
      <h1>運転日報</h1>
      <p>DRIVER DAILY REPORT</p>
    </div>
    <div class="home-date" id="homeDate"></div>

    <button class="home-btn start" onclick="showScreen('start')">
      <span class="btn-icon">🚀</span>
      <div class="btn-text">
        <h2>業務開始</h2>
        <p>出発前に入力・送信</p>
      </div>
      <span class="arrow">›</span>
    </button>

    <button class="home-btn end" onclick="showScreen('end')">
      <span class="btn-icon">🏁</span>
      <div class="btn-text">
        <h2>業務終了</h2>
        <p>帰着後に入力・送信</p>
      </div>
      <span class="arrow">›</span>
    </button>
  </div>
</div>

<!-- ===== 業務開始フォーム ===== -->
<div class="screen form-screen" id="screen-start">
  <div class="form-header start">
    <button class="back-btn" onclick="showScreen('home')">‹</button>
    <div class="form-header-text">
      <h2>🚀 業務開始</h2>
      <p>START OF WORK</p>
    </div>
  </div>
  <div class="form-body">
    <div class="form-inner">

      <div class="section">
        <div class="section-title gray">📋 基本情報</div>
        <div class="grid">
          <div class="field">
            <label>配送日 <span class="req">*</span></label>
            <input type="date" id="s-date" required>
          </div>
          <div class="grid g2">
            <div class="field">
              <label>車両番号 <span class="req">*</span></label>
              <input type="text" id="s-vehicle" placeholder="品川300あ1234" required>
            </div>
            <div class="field">
              <label>運送会社名 <span class="req">*</span></label>
              <input type="text" id="s-company" placeholder="例：ロジボン" required>
            </div>
          </div>
          <div class="field">
            <label>運転者名（苗字のみ） <span class="req">*</span></label>
            <input type="text" id="s-driver" placeholder="例：田中" required>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title blue">🕐 業務開始</div>
        <div class="grid g2">
          <div class="field">
            <label>業務開始時間 <span class="req">*</span></label>
            <input type="time" id="s-start-time" required>
          </div>
          <div class="field">
            <label>業務開始距離（km）</label>
            <input type="number" id="s-km-start" placeholder="例：12345" min="0">
          </div>
        </div>
      </div>

      <div class="section">
        <button class="btn-submit blue" id="s-btn" onclick="submitStart()">🚀 業務開始を送信</button>
      </div>

    </div>
  </div>
</div>

<!-- ===== 業務終了フォーム ===== -->
<div class="screen form-screen" id="screen-end">
  <div class="form-header end">
    <button class="back-btn" onclick="showScreen('home')">‹</button>
    <div class="form-header-text">
      <h2>🏁 業務終了</h2>
      <p>END OF WORK</p>
    </div>
  </div>
  <div class="form-body">
    <div class="form-inner">

      <div class="section">
        <div class="section-title gray">📋 基本情報</div>
        <div class="grid">
          <div class="field">
            <label>配送日 <span class="req">*</span></label>
            <input type="date" id="e-date" required>
          </div>
          <div class="grid g2">
            <div class="field">
              <label>車両番号 <span class="req">*</span></label>
              <input type="text" id="e-vehicle" placeholder="品川300あ1234" required>
            </div>
            <div class="field">
              <label>運送会社名 <span class="req">*</span></label>
              <input type="text" id="e-company" placeholder="例：ロジボン" required>
            </div>
          </div>
          <div class="field">
            <label>運転者名（苗字のみ） <span class="req">*</span></label>
            <input type="text" id="e-driver" placeholder="例：田中" required>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title green">🏁 業務終了</div>
        <div class="grid">
          <div class="grid g2">
            <div class="field">
              <label>業務終了時間 <span class="req">*</span></label>
              <input type="time" id="e-end-time" required>
            </div>
            <div class="field">
              <label>業務終了距離（km）</label>
              <input type="number" id="e-km-end" placeholder="例：12567" min="0">
            </div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title green">🛣️ 高速料金</div>
        <div class="field">
          <label>高速料金（円）</label>
          <input type="number" id="e-highway-fee" placeholder="例：1200" min="0">
        </div>
        <div class="field" style="margin-top:10px">
          <label>領収書・ETCレシート画像</label>
          <div class="photo-upload">
            <input type="file" accept="image/*" multiple onchange="previewPhoto(this,'prev-highway')">
            <div class="photo-upload-icon">🧾</div>
            <p><strong>タップして選択</strong></p>
          </div>
          <div class="preview-row" id="prev-highway"></div>
        </div>
      </div>

      <div class="section">
        <div class="section-title green">🅿️ 駐車場使用</div>
        <div class="field">
          <label>駐車場使用金額（円）</label>
          <input type="number" id="e-parking-fee" placeholder="例：300" min="0">
        </div>
        <div class="field" style="margin-top:10px">
          <label>領収書画像</label>
          <div class="photo-upload">
            <input type="file" accept="image/*" multiple onchange="previewPhoto(this,'prev-parking')">
            <div class="photo-upload-icon">📷</div>
            <p><strong>タップして選択</strong></p>
          </div>
          <div class="preview-row" id="prev-parking"></div>
        </div>
      </div>

      <div class="section">
        <div class="section-title green">📝 特記事項・備考</div>
        <div class="field">
          <textarea id="e-notes" placeholder="特記事項、イレギュラー、申し送り事項などを入力"></textarea>
        </div>
      </div>

      <div class="section">
        <button class="btn-submit green" id="e-btn" onclick="submitEnd()">🏁 業務終了を送信</button>
      </div>

    </div>
  </div>
</div>

<!-- Success: 業務開始 -->
<div class="overlay blue-bg" id="overlay-start">
  <div class="success-box blue-top">
    <div class="big">🚀</div>
    <h2>業務開始を送信しました！</h2>
    <p>業務終了時にトップ画面から<br>「業務終了」を選んで送信してください。</p>
    <div class="report-id" id="s-report-id"></div>
    <div class="overlay-btns">
      <button class="close-btn" onclick="closeOverlay('start')">続けて入力</button>
      <button class="home-btn-small" onclick="goHome('start')">🏠 トップへ</button>
    </div>
  </div>
</div>

<!-- Success: 業務終了 -->
<div class="overlay green-bg" id="overlay-end">
  <div class="success-box green-top">
    <div class="big">✅</div>
    <h2>業務終了を送信しました！</h2>
    <p>本日の日報が完成しました。<br>お疲れ様でした！</p>
    <div class="report-id" id="e-report-id"></div>
    <div class="overlay-btns">
      <button class="close-btn" onclick="closeOverlay('end')">続けて入力</button>
      <button class="home-btn-small" onclick="goHome('end')">🏠 トップへ</button>
    </div>
  </div>
</div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbySfHDPqnWrWHhRWE2ibiX2iqBP5DWpuzUHSxjyoO90Xav8pOYnkaU9ueg8JXwZqCNWRw/exec';

  // 今日の日付 & 現在時刻を自動入力
  const now = new Date();
  const wdays = ['日','月','火','水','木','金','土'];
  const todayStr = now.toISOString().split('T')[0];
  const nowTime  = now.toTimeString().slice(0,5);
  document.getElementById('homeDate').textContent =
    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日（${wdays[now.getDay()]}）`;
  document.getElementById('s-date').value = todayStr;
  document.getElementById('e-date').value = todayStr;
  document.getElementById('s-start-time').value = nowTime;
  document.getElementById('e-end-time').value   = nowTime;

  // 画面切り替え
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const target = id === 'home' ? document.getElementById('home') : document.getElementById('screen-' + id);
    target.classList.add('active');
    window.scrollTo(0,0);
  }

  // 写真プレビュー
  function previewPhoto(input, id) {
    const c = document.getElementById(id);
    [...input.files].forEach(f => {
      const r = new FileReader();
      r.onload = ev => { const img = document.createElement('img'); img.src = ev.target.result; c.appendChild(img); };
      r.readAsDataURL(f);
    });
  }

  // base64変換
  function toBase64(file) {
    return new Promise(resolve => { const r = new FileReader(); r.onload = ev => resolve(ev.target.result); r.readAsDataURL(file); });
  }
  function toBase64Multi(files) { return Promise.all([...files].map(f => toBase64(f))); }

  // 業務開始 送信
  async function submitStart() {
    const date    = document.getElementById('s-date').value;
    const vehicle = document.getElementById('s-vehicle').value.trim();
    const company = document.getElementById('s-company').value.trim();
    const driver  = document.getElementById('s-driver').value.trim();
    const start   = document.getElementById('s-start-time').value;
    if (!date || !vehicle || !company || !driver) { alert('基本情報をすべて入力してください。'); return; }
    if (!start) { alert('業務開始時間を入力してください。'); return; }

    const btn = document.getElementById('s-btn');
    btn.textContent = '📡 送信中...'; btn.disabled = true;

    const reportId = company + '-' + vehicle + '-' + date.replace(/-/g,'');
    const payload = {
      type:'start', report_id:reportId,
      delivery_date:date, vehicle_no:vehicle, company, driver_name:driver,
      work_start:start,
      km_start:document.getElementById('s-km-start').value,
    };

    try {
      const res = await fetch(GAS_URL, { method:'POST', body:JSON.stringify(payload) });
      const json = await res.json();
      if (json.result !== 'success') throw new Error(json.message);
      document.getElementById('s-report-id').textContent = '日報ID: ' + reportId;
      document.getElementById('overlay-start').classList.add('show');
    } catch(err) {
      alert('送信エラー: ' + err.message);
    } finally {
      btn.textContent = '🚀 業務開始を送信'; btn.disabled = false;
    }
  }

  // 業務終了 送信
  async function submitEnd() {
    const date    = document.getElementById('e-date').value;
    const vehicle = document.getElementById('e-vehicle').value.trim();
    const company = document.getElementById('e-company').value.trim();
    const driver  = document.getElementById('e-driver').value.trim();
    const end     = document.getElementById('e-end-time').value;
    if (!date || !vehicle || !company || !driver) { alert('基本情報をすべて入力してください。'); return; }
    if (!end) { alert('業務終了時間を入力してください。'); return; }

    const btn = document.getElementById('e-btn');
    btn.textContent = '📡 送信中...'; btn.disabled = true;

    const highwayInput = document.querySelector('input[onchange*="prev-highway"]');
    const parkingInput = document.querySelector('input[onchange*="prev-parking"]');
    const fileHighway  = highwayInput?.files.length ? await toBase64Multi(highwayInput.files) : [];
    const fileParking  = parkingInput?.files.length ? await toBase64Multi(parkingInput.files) : [];

    const reportId = company + '-' + vehicle + '-' + date.replace(/-/g,'');
    const payload = {
      type:'end', report_id:reportId,
      delivery_date:date, vehicle_no:vehicle, company, driver_name:driver,
      work_end:end,
      km_end:document.getElementById('e-km-end').value,
      highway_fee:document.getElementById('e-highway-fee').value,
      parking_fee:document.getElementById('e-parking-fee').value,
      notes:document.getElementById('e-notes').value,
      file_highway:fileHighway, file_parking:fileParking,
    };

    try {
      const res = await fetch(GAS_URL, { method:'POST', body:JSON.stringify(payload) });
      const json = await res.json();
      if (json.result !== 'success') throw new Error(json.message);
      document.getElementById('e-report-id').textContent = '日報ID: ' + reportId;
      document.getElementById('overlay-end').classList.add('show');
    } catch(err) {
      alert('送信エラー: ' + err.message);
    } finally {
      btn.textContent = '🏁 業務終了を送信'; btn.disabled = false;
    }
  }

  // オーバーレイを閉じる
  function closeOverlay(type) {
    document.getElementById('overlay-' + type).classList.remove('show');
  }

  // トップへ戻る
  function goHome(type) {
    closeOverlay(type);
    showScreen('home');
  }
</script>
</body>
</html>
